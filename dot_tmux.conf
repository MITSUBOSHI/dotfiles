# tmux configuration

# vi keybind in copy mode
set-window-option -g mode-keys vi

# Disable automatic window renaming
set-window-option -g automatic-rename off

# Mouse support
set-option -g mouse on

# History limit
set-option -g history-limit 10000

# Mouse wheel scrolling
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M

# Default shell
set-option -g default-shell /bin/zsh
# macOS only: wrap shell with reattach-to-user-namespace for clipboard access.
# On Linux/WSL2 the command is absent, so guard it to avoid panes exiting immediately.
if-shell 'command -v reattach-to-user-namespace' \
  'set -g default-command "reattach-to-user-namespace -l /bin/zsh"'
